[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainfed-edge"
version = "0.1.0"
description = "Research prototype for event-triggered federated spiking neural networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Liangshun Wu"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]
dev = ["ruff>=0.6"]

[project.scripts]
brainfed = "brainfed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
